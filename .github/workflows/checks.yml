name: Checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -W error::ResourceWarning -m unittest -v
      - run: node --check docs/app.js && node --check docs/engine.js
      - run: python monitor.py check --at "2026-11-10 07:00"
      - run: python monitor.py report
